[project]
name = "ooi-fin-whales"
version = "0.1.0"
description = "Extending a 2003-2013 fin whale call time series into the OOI era with an automated detector"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    # Data access. obspy speaks FDSN and gives us the same client for the
    # 2011-2013 era and the present day, which is the whole point of the
    # one-pipeline-both-eras decision.
    "obspy>=1.4",
    "numpy>=1.26",
    "scipy>=1.11",

    # Tabular results. polars over pandas for the lazy scan API, since the
    # measurement tables get large once whole seasons are processed.
    "polars>=1.0",

    # Reading the 2017 study's archived per-note detections.
    "h5py>=3.10",

    # Detection. torch and torchaudio are core: the Schall DSP baseline does
    # not need them, but the detector interface and its tests do.
    "torch>=2.0",
    "torchaudio>=2.0",

    "marimo>=0.9",
]

[project.optional-dependencies]
# Whale-VAD is GPL-3.0. It is kept optional so that installing and using this
# package does not by itself pull a copyleft dependency into the environment.
# See the License section of README.md.
whalevad = ["whalevad>=0.1.6"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ooi_fin_whales"]

[tool.pytest.ini_options]
# Settings follow the Scientific Python Development Guide (PP302-PP309).
# filterwarnings = ["error"] is the one that earns its place fastest: obspy
# deprecated the "IRIS" FDSN client name in favour of "EARTHSCOPE", and a
# deprecation in the data access path should fail a test rather than scroll past.
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
log_cli_level = "INFO"

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
extend-select = [
  "B",    # flake8-bugbear
  "I",    # isort
  "ARG",  # unused arguments
  "C4",   # comprehensions
  "ICN",  # import conventions
  "NPY",  # numpy-specific rules
  "PGH",  # pygrep-hooks
  "PIE",
  "PL",   # pylint
  "PT",   # pytest style
  "RET",
  "RUF",
  "SIM",
  "UP",   # pyupgrade
]
