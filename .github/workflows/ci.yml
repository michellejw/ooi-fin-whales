name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Jobs that need more should ask for it explicitly.
permissions:
  contents: read

jobs:
  lint:
    name: Lint and guideline compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to commit SHAs rather than tags: a tag can be moved
      # to point at different code, and these run with repository credentials.
      # Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the credential in .git/config where later steps, or
          # anything that uploads the workspace, could pick it up.
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure
      - name: Check against the Scientific Python Development Guide
        # Deliberately not failing the build on this. Some checks (a docs
        # folder, a task runner, a type checker) are recorded as considered
        # and declined in README.md, so a clean run is not the goal. It is
        # here so that drift shows up in the log rather than silently.
        run: uvx 'sp-repo-review[cli]' . || true

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked
      - name: Test
        # A fresh clone, installed from the lockfile, running the suite. This
        # is what makes the reproducibility claim in README.md tested rather
        # than asserted.
        run: uv run pytest
