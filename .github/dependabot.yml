version: 2
updates:
  # Actions drift faster than anything else here and are the most security
  # sensitive, since they run with repository credentials. They are pinned to
  # commit SHAs in the workflow, so Dependabot is what keeps those current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      # One PR for all of them rather than one each.
      actions:
        patterns: ["*"]

  # torch and obspy both move quickly. Monthly rather than weekly: this is a
  # single-maintainer research repository and weekly PRs would be noise.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python:
        patterns: ["*"]
